<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanuk, tu oso polar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<style>
#nanuk{--noche:#0d2a40;--nieve:#fff;--sombra:#b9dbe8;--nariz:#1b2a36;--acento:#ff7a8a;--barra:#4fb6e0}
#nanuk,#nanuk *{box-sizing:border-box}
#nanuk{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;font-family:"Fredoka",system-ui,sans-serif;color:var(--noche);background:linear-gradient(180deg,#a9dcf0,#e9f8fd)}
#nanuk .game{width:min(460px,100%);text-align:center}
#nanuk header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#nanuk h1{margin:0;font-size:2rem;font-weight:600}
#nanuk .chips span{display:inline-block;margin-left:6px;padding:5px 12px;border-radius:99px;background:var(--nieve);font-weight:600;font-size:.9rem}
#nanuk .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:12px}
#nanuk .stat{text-align:left;font-size:.85rem}
#nanuk .bar{margin-top:2px;height:11px;border-radius:99px;background:rgba(13,42,64,.15);overflow:hidden}
#nanuk .bar i{display:block;height:100%;width:100%;background:var(--barra);border-radius:99px;transition:width .5s}
#nanuk .bar i.bajo{background:var(--acento)}
#nanuk .stage{position:relative;padding:14px 12px 10px;border-radius:28px;border:3px solid var(--nieve);box-shadow:0 10px 30px rgba(13,42,64,.18);overflow:hidden;transition:background .6s;background:#dff3fa}
#nanuk .stage[data-room=cocina]{background:linear-gradient(#fbe9d0 70%,#e8c99b 70%)}
#nanuk .stage[data-room=bano]{background:repeating-linear-gradient(#cfeef5 0 38px,#bfe4ee 38px 40px)}
#nanuk .stage[data-room=cuarto]{background:#d8dcf5}
#nanuk .stage.noche{background:#22415c}
#nanuk .stage.noche .msg{color:var(--nieve)}
#nanuk #bear{width:min(240px,66%);cursor:pointer;}
#nanuk #bear:focus-visible{outline:3px solid var(--barra);outline-offset:6px;border-radius:24px}
#nanuk .shadow{fill:rgba(13,42,64,.15)}
#nanuk .fur{fill:var(--nieve);stroke:var(--sombra);stroke-width:3}
#nanuk .ear-in{fill:#f7c9d0}
#nanuk .muzzle{fill:#f1fafd;stroke:var(--sombra);stroke-width:2}
#nanuk .eye,#nanuk .nose{fill:var(--nariz)}
#nanuk .glint{fill:#fff}
#nanuk .mouth,#nanuk .closed,#nanuk .equis{fill:none;stroke:var(--nariz);stroke-width:3;stroke-linecap:round}
#nanuk .equis{stroke-width:4}
#nanuk .blush{fill:var(--acento);opacity:.35}
#nanuk .closed,#nanuk .equis,#nanuk .halo{display:none}
#nanuk .halo{fill:none;stroke:#ffd76a;stroke-width:5}
#nanuk .dormido .eyes{display:none}
#nanuk .dormido .closed{display:block}
#nanuk .eyes{transform-origin:100px 84px;animation:nk-parp 5s infinite}
@keyframes nk-parp{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#nanuk .muerto .eyes,#nanuk .muerto .closed,#nanuk .muerto .blush{display:none}
#nanuk .muerto .equis,#nanuk .muerto .halo{display:block}
#nanuk #bubbles circle{fill:#fff;stroke:var(--barra);stroke-width:2;animation:nk-bur 1.4s forwards}
@keyframes nk-bur{to{opacity:0;transform:translateY(-40px)}}
#nanuk .zzz{position:absolute;top:36px;right:18%;font-weight:600;font-size:1.5rem;color:#fff;opacity:0}
#nanuk .noche .zzz{opacity:1;animation:nk-flota 2.4s ease-in-out infinite}
@keyframes nk-flota{50%{transform:translateY(-10px)}}
#nanuk .msg{margin:8px 0 0;min-height:1.4em}
#nanuk nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
#nanuk nav button{background:rgba(13,42,64,.12);color:var(--noche);padding:10px 2px;font-size:.85rem}
#nanuk nav button.on{background:var(--noche);color:#fff}
#nanuk .panel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#nanuk .panel canvas{grid-column:1/-1;width:100%;border-radius:18px;touch-action:none}
#nanuk .panel .info{grid-column:1/-1;margin:0;font-size:.9rem}
#nanuk button{font:inherit;font-weight:600;padding:12px 8px;border:0;border-radius:16px;background:var(--noche);color:#fff;cursor:pointer}
#nanuk button:hover{filter:brightness(1.2)}
#nanuk button:active{transform:translateY(2px)}
#nanuk button:focus-visible{outline:3px solid var(--barra);outline-offset:2px}
#nanuk button small{display:block;font-weight:400;font-size:.75rem;opacity:.8}
#nanuk .mor{background:#5b2e8c}
#nanuk .rosa{background:var(--acento);color:var(--noche);grid-column:1/-1}
#nanuk .hint{margin:10px 0 0;font-size:.8rem;opacity:.7}
@media(prefers-reduced-motion:reduce){#nanuk,#nanuk *{animation:none!important;transition:none!important}
}
#nanuk #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#nanuk #cuerpo{transform-origin:100px 210px;animation:nk-resp 3s ease-in-out infinite}
#nanuk #cabeza{transform-origin:100px 140px;animation:nk-cabeceo 6s ease-in-out infinite}
#nanuk #sombra{transform-origin:100px 212px}
#nanuk .brazo{transform-origin:50% 0}
#nanuk #brazoL{transform-origin:46px 140px}
#nanuk #brazoR{transform-origin:154px 140px}
#nanuk #mirada{transition:transform .15s}
#nanuk #boca{display:none;transform-origin:100px 112px}
@keyframes nk-resp{50%{transform:scale(1.015,1.03)}}
@keyframes nk-cabeceo{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
#nanuk .abre #boca,#nanuk .bosteza #boca,#nanuk .mastica #boca{display:block}
#nanuk .abre .mouth,#nanuk .bosteza .mouth,#nanuk .mastica .mouth{display:none}
#nanuk .mastica #boca{animation:nk-chew .25s 6}
@keyframes nk-chew{50%{transform:scaleY(.35)}}
#nanuk .mastica #cabeza{animation:nk-mast .25s 6}
@keyframes nk-mast{50%{transform:translateY(3px) rotate(2deg)}}
#nanuk .salto #cuerpo{animation:nk-salto .6s}
#nanuk .salto #sombra{animation:nk-sombra .6s}
@keyframes nk-salto{0%,100%{transform:none}20%{transform:scale(1.08,.86)}50%{transform:translateY(-34px) scale(.94,1.08)}80%{transform:scale(1.06,.9)}}
@keyframes nk-sombra{50%{transform:scale(.55);opacity:.5}}
#nanuk .baila #cuerpo{animation:nk-baila .5s 4}
#nanuk .baila #brazoL{animation:nk-alzaL .5s 4}
#nanuk .baila #brazoR{animation:nk-alzaR .5s 4}
@keyframes nk-baila{25%{transform:translateY(-14px) rotate(-6deg)}75%{transform:translateY(-14px) rotate(6deg)}}
@keyframes nk-alzaL{50%{transform:rotate(-150deg)}}
@keyframes nk-alzaR{50%{transform:rotate(150deg)}}
#nanuk .saluda #brazoR{animation:nk-saluda .4s 4}
@keyframes nk-saluda{0%,100%{transform:rotate(-130deg)}50%{transform:rotate(-165deg)}}
#nanuk .bosteza #boca{transform:scale(1.35)}
#nanuk .bosteza #cabeza{animation:nk-bost 2s}
@keyframes nk-bost{30%,70%{transform:rotate(-6deg) translateY(-4px)}}
#nanuk .sacude #cuerpo{animation:nk-sac .5s}
@keyframes nk-sac{20%,60%{transform:rotate(-5deg)}40%,80%{transform:rotate(5deg)}}
#nanuk #bear.muerto #cuerpo{animation:none;transform:rotate(-8deg)}
#nanuk #bear.muerto #cabeza{animation:none}
#nanuk .food,#nanuk .jabon{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:16px;background:var(--noche);color:#fff;cursor:grab;user-select:none;touch-action:none;font-weight:600;font-size:.85rem}
#nanuk .food b{font-size:2.2rem;line-height:1.2}
#nanuk .food small{opacity:.8;font-weight:400}
#nanuk .drag{position:fixed;z-index:9;transform:translate(-50%,-50%) scale(1.3);font-size:3rem;pointer-events:none}
#nanuk .zzz{display:none!important}
#nanuk #bear,#nanuk .msg{position:relative;z-index:1}
#nanuk .jabon{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:16px;background:#2a7fb0;color:#fff;cursor:grab;user-select:none;touch-action:none;font-weight:600;font-size:.85rem}
#nanuk .jabon b{font-size:2.2rem;line-height:1.2}
#nanuk .jabon small{font-weight:400;opacity:.85;font-size:.75rem}
#nanuk .stage.noche{background:#14283f}
#nanuk .stage.noche::before{content:"";position:absolute;inset:0;z-index:0;background-image:radial-gradient(circle,#fff 1.2px,transparent 1.8px),radial-gradient(circle,#ffe9a8 1px,transparent 1.6px);background-size:60px 60px,37px 37px;background-position:10px 8px,25px 30px;animation:nk-titila 3s ease-in-out infinite alternate}
@keyframes nk-titila{to{opacity:.35}}
#nanuk .luna{position:absolute;top:12px;left:16px;font-size:2rem;opacity:0;transform:translateY(-20px);transition:.8s}
#nanuk .noche .luna{opacity:1;transform:none}
#nanuk #manta,#nanuk #moco{display:none}
#nanuk .dormido #manta{display:block}
#nanuk .dormido #cuerpo{animation:nk-respd 4.5s ease-in-out infinite;transform:translateY(8px)}
@keyframes nk-respd{0%,100%{transform:translateY(8px)}50%{transform:translateY(8px) scale(1.02,1.04)}}
#nanuk .dormido #cabeza{animation:none;transform:rotate(9deg) translateY(4px)}
#nanuk .dormido #moco{display:block;transform-box:fill-box;transform-origin:center;animation:nk-moco 3s ease-in-out infinite}
@keyframes nk-moco{0%{transform:scale(.1);opacity:1}80%{transform:scale(1.8);opacity:1}100%{transform:scale(2);opacity:0}}
#nanuk .no #cabeza{animation:nk-no .5s 2}
@keyframes nk-no{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
</style>
</head>
<body>
<div id="nanuk">
<main class="game">
  <header><h1>Nanuk</h1><div class="chips"><span id="nivel"></span><span id="monedas"></span></div></header>
  <section class="stats">
    <div class="stat"><span>Hambre</span><div class="bar"><i id="b-hambre"></i></div></div>
    <div class="stat"><span>Energía</span><div class="bar"><i id="b-energia"></i></div></div>
    <div class="stat"><span>Diversión</span><div class="bar"><i id="b-diversion"></i></div></div>
    <div class="stat"><span>Limpieza</span><div class="bar"><i id="b-limpieza"></i></div></div>
  </section>
  <section class="stage" id="stage">
    <svg id="bear" viewBox="0 0 200 220" role="img" aria-label="Nanuk, el oso polar" tabindex="0">
      <ellipse class="shadow" id="sombra" cx="100" cy="212" rx="55" ry="7"/>
      <g id="cuerpo">
        <g class="brazo" id="brazoL"><ellipse class="fur" cx="44" cy="160" rx="13" ry="27" transform="rotate(18 44 160)"/></g>
        <g class="brazo" id="brazoR"><ellipse class="fur" cx="156" cy="160" rx="13" ry="27" transform="rotate(-18 156 160)"/></g>
        <ellipse class="fur" cx="100" cy="150" rx="58" ry="58"/>
        <ellipse class="fur" cx="62" cy="200" rx="18" ry="11"/><ellipse class="fur" cx="138" cy="200" rx="18" ry="11"/>
        <g id="manta"><path d="M42 150 q58 -12 116 0 l8 58 h-132z" fill="#7aa7e8" stroke="#5a86c8" stroke-width="3"/><path d="M50 172 q50 -8 100 0 M46 190 q54 -8 108 0" fill="none" stroke="#a9c8f5" stroke-width="4" stroke-linecap="round"/></g>
        <g id="cabeza">
          <circle class="fur" cx="52" cy="58" r="20"/><circle class="ear-in" cx="52" cy="58" r="9"/>
          <circle class="fur" cx="148" cy="58" r="20"/><circle class="ear-in" cx="148" cy="58" r="9"/>
          <ellipse class="fur" cx="100" cy="90" rx="62" ry="54"/>
          <ellipse class="muzzle" cx="100" cy="108" rx="28" ry="21"/>
          <g id="mirada"><g class="eyes"><ellipse class="eye" cx="76" cy="84" rx="6.5" ry="8"/><ellipse class="eye" cx="124" cy="84" rx="6.5" ry="8"/>
            <circle class="glint" cx="78" cy="81" r="2.2"/><circle class="glint" cx="126" cy="81" r="2.2"/></g></g>
          <path class="closed" d="M68 86 q8 6 16 0 M116 86 q8 6 16 0"/>
          <path class="equis" d="M69 77 l14 14 M83 77 l-14 14 M117 77 l14 14 M131 77 l-14 14"/>
          <ellipse class="nose" cx="100" cy="98" rx="9" ry="6"/><circle id="moco" cx="106" cy="100" r="8" fill="rgba(160,220,255,.55)" stroke="#8ac" stroke-width="2"/>
          <g id="boca"><ellipse cx="100" cy="118" rx="14" ry="12" fill="#5a1f2b"/><ellipse cx="100" cy="125" rx="8" ry="5" fill="#ff7a8a"/></g>
          <path class="mouth" id="mouth" d="M88 114 q12 10 24 0"/>
          <ellipse class="blush" cx="60" cy="102" rx="8" ry="5"/><ellipse class="blush" cx="140" cy="102" rx="8" ry="5"/>
          <g id="mugre" fill="#8a6a4a" opacity="0"><circle cx="72" cy="66" r="6"/><circle cx="132" cy="70" r="5"/><circle cx="88" cy="62" r="3.5"/><circle cx="118" cy="122" r="4"/><circle cx="80" cy="124" r="3"/><circle cx="84" cy="172" r="7"/><circle cx="122" cy="184" r="6"/></g>


          <ellipse class="halo" cx="100" cy="12" rx="34" ry="8"/>
        </g>
      </g>
      <g id="bubbles"></g>
    </svg>
    <canvas id="fx"></canvas>
    <div class="luna" aria-hidden="true">🌙</div>
    <div class="zzz" aria-hidden="true">z z z</div>
    <p class="msg" id="msg" role="status"></p>
  </section>
  <nav id="nav">
    <button data-room="cocina">Cocina</button><button data-room="bano">Baño</button><button data-room="cuarto">Cuarto</button>
    <button data-room="juego">Juego</button>
  </nav>
  <section class="panel" id="panel"></section>
  <p class="hint">Arrastrá la comida a la boca de Nanuk. Teclas: 1-4 cambian de sala · D luz/dormir · P poción · R revivir</p>
</main>
</div>
<script>
(()=>{
const root=document.getElementById("nanuk")||document,K="nanuk-v2",$=id=>root.querySelector("#"+id),lim=n=>Math.max(0,Math.min(100,n));
const ST=["hambre","energia","diversion","limpieza"],TICK=4000;
const COMIDA=[["Pescado",0,25,0,"🐟"],["Salmón",5,40,5,"🍣"],["Helado",8,25,20,"🍦"],["Frutillas",3,20,10,"🍓"],["Camarones",6,35,8,"🦐"],["Torta",10,30,30,"🍰"]];
const FAV=new Date().getDate()%COMIDA.length;
const nuevo=()=>({hambre:55,energia:80,diversion:80,limpieza:80,monedas:20,xp:0,dormido:false,muerto:false,ultimo:Date.now()});
let s;try{s={...nuevo(),...JSON.parse(localStorage.getItem(K))}}catch{s=nuevo()}
const guardar=()=>{try{localStorage.setItem(K,JSON.stringify(s))}catch{}};
const bear=$("bear"),stage=$("stage"),msg=$("msg"),mouth=$("mouth"),panel=$("panel");
let sala="cocina",parar=()=>{};
const decir=t=>msg.textContent=t;
const nivel=()=>1+Math.floor(s.xp/60);
const gana=x=>{const a=nivel();s.xp+=x;if(nivel()>a){s.monedas+=10;decir("¡Nivel "+nivel()+"! +10 monedas");anim("baila",2000);emite("✨",10,{v:260,up:120,g:120,l:1.6})}};
const prom=()=>ST.reduce((a,k)=>a+s[k],0)/4;

function tiempo(n){
  if(s.muerto)return;
  for(let i=0;i<n;i++){
    if(s.dormido){s.energia=lim(s.energia+4);s.hambre=lim(s.hambre-.4);s.diversion=lim(s.diversion-.3);s.limpieza=lim(s.limpieza-.2)}
    else{s.hambre=lim(s.hambre-1.2);s.energia=lim(s.energia-.8);s.diversion=lim(s.diversion-1);s.limpieza=lim(s.limpieza-.6)}
  }
  if(s.dormido&&s.hambre<10){s.dormido=false;decir("Nanuk se despertó con hambre…");pintar()}else if(s.dormido&&s.energia>=100){s.dormido=false;decir("¡Nanuk despertó con energía!");pintar()}
}
function estadoMsg(){
  if(s.muerto)return "Nanuk ya no está con nosotros…";
  if(s.dormido)return "Zzz… energía "+Math.round(s.energia)+"%";
  const p=ST.reduce((a,b)=>s[a]<s[b]?a:b);
  if(s[p]>35)return "Nanuk está contento.";
  return {hambre:"Nanuk tiene hambre.",energia:"Nanuk tiene sueño.",diversion:"Nanuk se aburre.",limpieza:"Nanuk necesita un baño."}[p];
}
function anim(c,ms=700){const L=["salto","mastica","sacude","baila","saluda","bosteza","no"];bear.classList.remove(...L);void bear.getBoundingClientRect();bear.classList.add(c);clearTimeout(anim.t);anim.t=setTimeout(()=>bear.classList.remove(c),ms)}
function burbujas(){const g=$("bubbles");for(let i=0;i<5;i++){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",50+Math.random()*100);c.setAttribute("cy",60+Math.random()*120);c.setAttribute("r",4+Math.random()*6);g.appendChild(c);setTimeout(()=>c.remove(),1500)}}

function render(){
  ST.forEach(k=>{const b=$("b-"+k);b.style.width=s[k]+"%";b.classList.toggle("bajo",s[k]<=30)});
  $("nivel").textContent="Nivel "+nivel();$("monedas").textContent=s.monedas+" ❄️";
  stage.dataset.room=sala;$("mugre").style.opacity=s.limpieza<60?(60-s.limpieza)/60:0;stage.classList.toggle("noche",s.dormido);
  bear.classList.toggle("dormido",s.dormido);bear.classList.toggle("muerto",s.muerto);
  const p=prom();
  mouth.setAttribute("d",s.muerto?"M90 120 h20":p>60?"M86 113 q14 14 28 0":p>30?"M90 118 q10 2 20 0":"M88 122 q12 -10 24 0");
  root.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.room==sala));
}
function pintar(){
  parar();
  if(s.muerto){panel.innerHTML='<button class="rosa" data-a="revivir">Revivir a Nanuk</button>';return}
  if(s.dormido){panel.innerHTML='<button class="rosa" data-a="dormir">Encender luz</button>';return}
  const B=(a,t,x="",c="")=>`<button class="${c}" data-a="${a}" data-x="${x}">${t}</button>`;
  panel.innerHTML={
    cocina:COMIDA.map((c,i)=>`<div class="food" data-i="${i}" data-e="${c[4]}"><b>${c[4]}</b>${c[0]}${i==FAV?" ⭐":""}<small>${c[1]?c[1]+" ❄️":"gratis"}</small></div>`).join("")+'<p class="info">Arrastrá la comida hasta la boca de Nanuk (o tocala).</p>',
    bano:'<div class="jabon"><b>🧼</b>Jabón<small>frotalo sobre Nanuk</small></div>'+B("banar","Ducha rápida<small>gratis</small>")+'<p class="info">Arrastrá el jabón y frotá a Nanuk hasta dejarlo limpio.</p>',
    cuarto:B("dormir","Apagar luz y dormir<small>recupera energía</small>")+B("pocion","Poción de matar","","mor"),
    juego:B("jugar","Atrapa pescados<small>−15 energía, ganás ❄️</small>"),
  }[sala];
  panel.style.gridTemplateColumns=sala=="cocina"?"repeat(3,1fr)":"";
}

function juego(p){
  p.innerHTML='<canvas id="cv" width="320" height="280"></canvas><p class="info">Atrapá 🐟 y esquivá 🧊. Mové con mouse, dedo o ← →</p>';
  const cv=$("cv"),c=cv.getContext("2d"),ks={};
  let x=160,pts=0,t=20,it=[],u=performance.now(),sp=0,vivo=true;
  const mv=e=>{const r=cv.getBoundingClientRect();x=(e.clientX-r.left)*320/r.width};
  cv.addEventListener("pointermove",mv);cv.addEventListener("pointerdown",mv);
  const kd=e=>{ks[e.key]=1;if(e.key.startsWith("Arrow"))e.preventDefault()},ku=e=>delete ks[e.key];
  addEventListener("keydown",kd);addEventListener("keyup",ku);
  parar=()=>{vivo=false;removeEventListener("keydown",kd);removeEventListener("keyup",ku);parar=()=>{}};
  const fin=()=>{const g=Math.max(0,pts);parar();s.monedas+=g;s.diversion=lim(s.diversion+30);s.energia=lim(s.energia-15);s.limpieza=lim(s.limpieza-5);gana(g*2);decir("Juego terminado: +"+g+" monedas");guardar();pintar();render()};
  const f=n=>{
    if(!vivo)return;
    const dt=Math.min((n-u)/1000,.05);u=n;t-=dt;sp-=dt;
    if(ks.ArrowLeft)x-=260*dt;if(ks.ArrowRight)x+=260*dt;x=Math.max(30,Math.min(290,x));
    if(sp<=0){sp=.45;it.push({x:20+Math.random()*280,y:-10,m:Math.random()<.25})}
    c.fillStyle="#cfeaf5";c.fillRect(0,0,320,280);
    c.textAlign="center";c.font="44px serif";c.fillText("🐻‍❄️",x,276);
    it=it.filter(o=>{o.y+=(110+(20-t)*4)*dt;
      if(Math.abs(o.x-x)<32&&o.y>235&&o.y<280){pts+=o.m?-1:1;return false}
      c.font="26px serif";c.fillText(o.m?"🧊":"🐟",o.x,o.y);return o.y<300});
    c.font="600 16px Fredoka,sans-serif";c.fillStyle="#0d2a40";c.textAlign="left";c.fillText("🐟 "+pts+"   ⏱ "+Math.ceil(t),8,22);
    t>0?requestAnimationFrame(f):fin();
  };
  requestAnimationFrame(f);
}

let sure=0;
const A={
  comer(i){const[n,p,h,d,e]=COMIDA[i];
    if(s.hambre>=95){anim("no",1000);return decir("Nanuk está lleno. Esperá a que le baje el hambre.")}
    if(s.monedas<p)return decir("Te faltan monedas.");
    s.monedas-=p;const fav=i==FAV;
    s.hambre=lim(s.hambre+h*(fav?1.5:1));s.diversion=lim(s.diversion+d+(fav?10:0));s.limpieza=lim(s.limpieza-4);
    anim("mastica",1500);emite(e,5,{y:.55,up:50,g:200,v:160,l:.9});
    setTimeout(()=>{emite("❤️",fav?6:3,{y:.2,up:70,g:-30,l:1.5});if(s.hambre>90){emite("💨",2,{x:.65,y:.55,up:10,g:-10,v:50,l:1});decir("¡Buuurp!")}},1500);
    gana(fav?6:3);decir(fav?"¡Es su comida favorita! ⭐":"Ñam ñam, ¡"+n.toLowerCase()+"!")},
  banar(){s.limpieza=100;s.diversion=lim(s.diversion+5);anim("sacude");burbujas();emite("🫧",8,{v:200,up:60,g:-60,l:1.6});gana(3);decir("Nanuk quedó blanquito.")},
  dormir(){if(!s.dormido&&s.energia>=95)return decir("Nanuk no tiene sueño todavía.");s.dormido=!s.dormido;if(!s.dormido)gana(4);decir(s.dormido?"Luz apagada. Buenas noches, Nanuk…":"¡Buen día, Nanuk!");pintar()},
  pocion(){if(!sure){sure=1;setTimeout(()=>sure=0,3000);return decir("¿Seguro? Tocá la poción otra vez para confirmar.")}sure=0;s.muerto=true;s.dormido=false;burbujas();decir("Nanuk se fue al cielo polar…");pintar()},
  revivir(){s.muerto=false;ST.forEach(k=>s[k]=50);anim("salto");decir("¡Nanuk volvió!");pintar()},
  jugar(){if(s.energia<15)return decir("Nanuk está muy cansado.");juego(panel)}
};
panel.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;A[b.dataset.a](b.dataset.x);guardar();render()});
const irA=r=>{sala=r;pintar();render()};
$("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)irA(b.dataset.room)});

const mimo=()=>{
  if(s.muerto)return;
  if(s.dormido){s.dormido=false;s.diversion=lim(s.diversion-6);decir("Nanuk despertó de mal humor…");pintar()}
  else{s.diversion=lim(s.diversion+4);gana(1);anim("salto");emite("❤️",3,{y:.2,up:70,g:-30,l:1.5});decir("¡Nanuk disfruta los mimos!")}
  guardar();render();
};
bear.addEventListener("click",mimo);
bear.addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();mimo()}});
const salas=["cocina","bano","cuarto","juego"];
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||(e.target.closest&&e.target.closest("input,textarea,select,[contenteditable]")))return;
  const k=e.key.toLowerCase();
  if(salas[k-1]){irA(salas[k-1]);return}
  const a={d:"dormir",p:"pocion",r:"revivir"}[k];
  if(!a||(a=="revivir")!=s.muerto||(s.dormido&&a!="dormir"))return;
  A[a]();guardar();render();
});


// ---- Partículas, mirada, comida arrastrable y vida propia ----
const fx=$("fx"),cx=fx.getContext("2d");let P=[],W=0,H=0,lt=performance.now();
const fit=()=>{W=fx.width=stage.clientWidth;H=fx.height=stage.clientHeight};
const nieve=Array.from({length:26},()=>({x:Math.random()*400,y:Math.random()*400,r:1+Math.random()*2.5,v:12+Math.random()*25}));
function emite(e,n,o={}){const b=bear.getBoundingClientRect(),r=stage.getBoundingClientRect(),x=o.X??b.left-r.left+b.width*(o.x??.5),y=o.Y??b.top-r.top+b.height*(o.y??.5);
  for(let i=0;i<n;i++)P.push({e,x,y,vx:(Math.random()-.5)*(o.v||120),vy:-(o.up??60)-Math.random()*80,g:o.g??200,t:0,l:o.l||1.2})}
function bucle(n){
  const dt=Math.min((n-lt)/1000,.05);lt=n;
  if(W!=stage.clientWidth||H!=stage.clientHeight)fit();
  cx.clearRect(0,0,W,H);cx.fillStyle="rgba(255,255,255,.85)";
  nieve.forEach(f=>{f.y+=f.v*dt;f.x+=Math.sin(f.y/30)*.3;if(f.y>H){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x%W,f.y,f.r,0,7);cx.fill()});
  cx.font="22px serif";cx.textAlign="center";
  P=P.filter(p=>{p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;cx.globalAlpha=Math.max(0,1-p.t/p.l);cx.fillText(p.e,p.x,p.y);return p.t<p.l});
  cx.globalAlpha=1;requestAnimationFrame(bucle);
}
fit();requestAnimationFrame(bucle);
const mir=$("mirada");
addEventListener("pointermove",e=>{if(s.dormido||s.muerto)return;const b=bear.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height*.4),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/200);mir.style.transform=`translate(${dx/d*5*k}px,${dy/d*4*k}px)`});
const sobreBoca=e=>{const b=bear.getBoundingClientRect();return Math.hypot(e.clientX-(b.left+b.width*.5),e.clientY-(b.top+b.height*.5))<b.width*.32};
panel.addEventListener("pointerdown",e=>{
  const f=e.target.closest(".food");if(!f||s.muerto||s.dormido)return;e.preventDefault();
  const i=+f.dataset.i;if(s.monedas<COMIDA[i][1])return decir("Te faltan monedas.");
  const g=document.createElement("div");g.className="drag";g.textContent=f.dataset.e;(root.body||root).appendChild(g);
  const x0=e.clientX,y0=e.clientY;let mov=false;
  const pos=ev=>{g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px";mov=mov||Math.hypot(ev.clientX-x0,ev.clientY-y0)>8;bear.classList.toggle("abre",mov&&sobreBoca(ev))};
  const up=ev=>{removeEventListener("pointermove",pos);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);g.remove();bear.classList.remove("abre");
    if(!mov||sobreBoca(ev)){A.comer(i);guardar();render()}else decir("Soltala sobre la boca de Nanuk.")};
  pos(e);addEventListener("pointermove",pos);addEventListener("pointerup",up);addEventListener("pointercancel",up);
});
setInterval(()=>{if(s.dormido||s.muerto||document.hidden)return;const a=s.energia<30?"bosteza":["saluda","bosteza","salto"][Math.random()*3|0];
  anim(a,a=="bosteza"?2000:1600);if(a=="saluda")emite("👋",1,{y:.1,up:30,g:-20,v:20})},8000);
const dentro=e=>{const b=bear.getBoundingClientRect();return e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom};
panel.addEventListener("pointerdown",e=>{
  if(!e.target.closest(".jabon")||s.muerto||s.dormido)return;e.preventDefault();
  const g=document.createElement("div");g.className="drag";g.textContent="🧼";(root.body||root).appendChild(g);
  let n=0,ok=s.limpieza>=100;
  const pos=ev=>{g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px";
    if(!dentro(ev))return;
    s.limpieza=lim(s.limpieza+1.5);s.diversion=lim(s.diversion+.15);
    if(++n%3==0){const r=stage.getBoundingClientRect();emite("🫧",1,{X:ev.clientX-r.left,Y:ev.clientY-r.top,v:60,up:30,g:-40,l:1.2})}
    if(s.limpieza>=100&&!ok){ok=true;decir("¡Nanuk quedó impecable!");gana(3);emite("✨",8,{v:200,up:100,g:80,l:1.4})}
    render()};
  const up=()=>{removeEventListener("pointermove",pos);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);g.remove();guardar()};
  pos(e);addEventListener("pointermove",pos);addEventListener("pointerup",up);addEventListener("pointercancel",up);
});
setInterval(()=>{if(s.dormido&&!s.muerto&&!document.hidden)emite("💤",1,{x:.62,y:.12,up:40,g:-25,v:30,l:2.4})},1600);
addEventListener("error",e=>{if((e.filename||"").includes("main.js"))decir("Error: "+e.message)});
tiempo(Math.min(Math.floor((Date.now()-s.ultimo)/TICK),2700));
decir(estadoMsg());pintar();render();
setInterval(()=>{tiempo(1);s.ultimo=Date.now();decir(estadoMsg());guardar();render()},TICK);
})();
</script>
